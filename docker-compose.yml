version: "3.8"

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: agentweave-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentweave
    ports:
      - "${TENVYR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agentweave-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentweave-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agentweave-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: agentweave-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-XX:-UseContainerSupport"
    networks:
      - agentweave-net
    healthcheck:
      test: echo stat | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: agentweave-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_OPTS: "-XX:-UseContainerSupport"
    networks:
      - agentweave-net
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: agentweave-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - agentweave-net

  # Tenvyr services
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: agentweave-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=3000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agentweave
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9092
      - ORCHESTRATOR_URL=http://orchestrator:3001
    networks:
      - agentweave-net

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: agentweave-orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ORCHESTRATOR_HOST=0.0.0.0
      - ORCHESTRATOR_PORT=3001
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agentweave
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9092
      - GATEWAY_URL=http://gateway:3000
      - ORCHESTRATOR_AGENT_NAMES=code-reviewer,observability
    networks:
      - agentweave-net

  agent-runner:
    build:
      context: .
      dockerfile: services/agent-runner/Dockerfile
    container_name: agentweave-agent-runner
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - KAFKA_BROKERS=kafka:9092
      - AGENT_RUNNER_PORT=8085
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_FAILURE_MODE=${LLM_FAILURE_MODE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
      - OLLAMA_API_URL=${OLLAMA_API_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
    networks:
      - agentweave-net

  agent-code-reviewer:
    build:
      context: .
      dockerfile: services/agent-code-reviewer/Dockerfile
    container_name: agentweave-agent-code-reviewer
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - KAFKA_BROKERS=kafka:9092
      - AGENT_RUNNER_URL=http://agent-runner:8085
    networks:
      - agentweave-net

  agent-observability:
    build:
      context: .
      dockerfile: services/agent-observability/Dockerfile
    container_name: agentweave-agent-observability
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - KAFKA_BROKERS=kafka:9092
      - AGENT_RUNNER_URL=http://agent-runner:8085
    networks:
      - agentweave-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: agentweave-frontend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_URL=http://localhost:3000
    networks:
      - agentweave-net

networks:
  agentweave-net:
    name: agentweave-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
